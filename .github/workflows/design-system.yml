# =============================================================================
# Design System Agent — Specifor On Premise
# Aplica/revê a camada de design a cada PR, SEM alterar conteúdo (texto/seções).
#
# ATIVAÇÃO (fazer no repo, via processo de segurança/SGSI):
#   1. Habilitar GitHub Actions no repositório.
#   2. Settings → Secrets and variables → Actions → New secret: ANTHROPIC_API_KEY
#   3. Settings → Actions → Workflow permissions → "Read and write permissions".
#   4. Branch protection na branch publicada: exigir PR + checks verdes.
#
# OBS: confirme a versão mais recente da action oficial em
#      https://github.com/anthropics/claude-code-action  (ajuste a tag @vX).
# =============================================================================
name: Design System

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-tokens:
    name: Lint (tokens do design system)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar stylelint
        run: npm i -g stylelint@16 stylelint-config-standard@36
      - name: Rodar lint
        run: npx stylelint "**/*.css" --config .stylelintrc.json || true
        # `|| true`: no começo o lint só reporta; troque para bloquear quando estabilizar.

  apply-design:
    name: Aplicar design (agente Claude)
    runs-on: ubuntu-latest
    needs: lint-tokens
    steps:
      - uses: actions/checkout@v4
      - name: Agente de design
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # O agente segue as instruções deste arquivo:
          prompt_file: .github/design-system-agent.md
          # Só toca no diff do PR e abre um commit de sugestão; nunca mexe em conteúdo.
